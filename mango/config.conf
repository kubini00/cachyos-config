# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur = 1
blur_layer = 0
blur_optimized= 1
blur_params_num_passes = 3
blur_params_radius = 4
blur_params_noise = 0.02
blur_params_brightness = 0.8
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=12
no_radius_when_single=0

focused_opacity=1
unfocused_opacity=1

# Animation Configuration(support type:zoom,slide)
#  tag_animation_direction: 1-horizontal,0-vertical

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=zoom
layer_animation_type_open=zoom
layer_animation_type_close=fade

animation_fade_in=1
animation_fade_out=1

# 0 - vertical, 1 - horizontal :3
tag_animation_direction=0

zoom_initial_ratio=0.4
zoom_end_ratio=0.8

fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8

animation_duration_open=350
animation_curve_open=0.62,0.34,0,1.1

animation_duration_close=150
animation_curve_close=0.08,0.92,0,1

animation_duration_move=350
animation_curve_move=0.11,0.37,0,1

animation_duration_tag=300
animation_curve_tag=0.43,0.34,0,1

animation_duration_focus=0
animation_curve_focus=0.46,1.0,0.29,1

animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Appearance
gappih=12
gappiv=12
gappoh=12
gappov=12
borderpx=2

source=~/.cache/wal/mangocolors.conf

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9


# Scroller Layout Setting
scroller_structs=10
scroller_default_proportion=0.93
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=4.5
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.33,0.93

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overviewgappi=12
overviewgappo=12

# Dwindle Setting
dwindle_preserve_split=1
dwindle_manual_split=0

# Misc
focus_on_activate=1
sloppyfocus=1
warpcursor=1
drag_tile_to_tile=1
focus_cross_monitor=0
focus_cross_tag=0
drag_warp_cursor=0
cursor_hide_timeout = 45

enable_floating_snap=1
snap_distance=50
no_border_when_single=1
idleinhibit_ignore_visible=0
tag_carousel=1

axis_bind_apply_timeout=100
cursor_size=32
cursor_theme=Satori-Komeiji

allow_tearing=2

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=pl

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Trackpad
# need relogin to make it apply
# disable_trackpad=0
# tap_to_click=1
# tap_and_drag=1
# drag_lock=1
# trackpad_natural_scrolling=0
# disable_while_typing=1
# left_handed=0
# middle_button_emulation=0
# swipe_min_threshold=1

# layout support:
# tile,scroller,grid,monocle,center_tile,vertical_tile,vertical_scroller,fair

circle_layout=dwindle,scroller,vertical_scroller

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle

tag_num=4
# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient
bind=SUPER+Shift,e,spawn,sh ~/.config/rofi/power/powermenu.sh 

# menu and terminal
bind=SUPER,d,spawn,~/.config/rofi/launch/launcher.sh 
bind=SUPER,Return,spawn,kitty
bind=SUPER,c,spawn,kitty
bind=SUPER,b,spawn,swaync-client --open-panel

# switch window focus
bind=Alt,Tab,focusstack,next
bind=Alt+Shift,Tab,focusstack,previous
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,overcircle,next
bind=SUPER+Shift,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,v,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
# bind=SUPER,Left,viewtoleft,0
# bind=CTRL,Left,viewtoleft_have_client,0
# bind=SUPER,Right,viewtoright,0
# bind=CTRL,Right,viewtoright_have_client,0
# bind=CTRL+SUPER,Left,tagtoleft,0
# bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0


# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it

bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0


bind=Alt+Shift,1,tagsilent,1,0
bind=Alt+Shift,2,tagsilent,2,0
bind=Alt+Shift,3,tagsilent,3,0
bind=Alt+Shift,4,tagsilent,4,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,up,focusmon,up
bind=alt+shift,down,focusmon,down

bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,up,tagmon,up
bind=SUPER+Alt,down,tagmon,down

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
# bind=CTRL+SHIFT,Up,movewin,+0,-50
# bind=CTRL+SHIFT,Down,movewin,+0,+50
# bind=CTRL+SHIFT,Left,movewin,-50,+0
# bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglefloating,0
mousebind=SUPER,btn_right,moveresize,curresize

# Media control
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=SUPER,Delete,spawn,amixer set Capture toggle

# Screenshotsd
bind = NONE, Print, spawn_shell, grim - | wl-copy && notify-send "Screenshot taken" "saved in clipboard"
bind = SUPER+Shift, S,spawn,~/.config/mango/screenshot.sh 
bind = SUPER, Print, spawn_shell, grim ~/Obrazy/ss/screenshot-$(date +%s).png && notify-send "Screenshot taken" "saved in gdziestam"


# Theme
bind=SUPER,t,spawn,~/.config/rofi/wallpaper/wallpaper.sh

# RGB
bind=SUPER+ctrl,o,spawn,openrgb -p ~/.config/OpenRGB/bez.orp
bind=SUPER+ctrl,p,spawn,openrgb -p ~/.config/OpenRGB/def.orp

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# window rule
windowrule=focused_opacity:1,appid:firefox
windowrule=focused_opacity:1,appid:Waydroid
windowrule=focused_opacity:1,appid:com.obsproject.Studio
windowrule=unfocused_opacity:1,appid:Waydroid
# windowrule=unfocused_opacity:0.9,appid:vesktop

layerrule=animation_type_open:slide,noshadow:1,layer_name:swaync
layerrule=animation_type_open:none,layer_name:waybar,layer_name:wayfreeze
layerrule=animation_type_open:none,layer_name:waybar

# monitor rule
monitorrule=model:PL2470H,width:1920,height:1080,refresh:165,x:0,y:0
#monitorrule=model:AAA,x:-960,y:,rr:3,scale:0.8

exec-once=~/.config/mango/autostart.sh
exec-once=openrgb -p ~/.config/OpenRGB/coom.orp --startminimized &
# exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
